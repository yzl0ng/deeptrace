[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deeptrace-r1"
version = "0.3.0"
description = "An evidence-grounded research agent with inspectable tool traces, training, and evaluation pipelines."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1",
  "sentence-transformers>=5,<6",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]
data = [
  "duckdb>=1.2,<2",
  "huggingface-hub>=0.35,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not integration' --basetemp=.pytest_cache/tmp"
markers = [
  "integration: uses the cached real BGE model and may take longer",
  "llm_integration: calls the real DeepSeek API and requires DEEPSEEK_API_KEY",
]

[tool.setuptools.packages.find]
include = ["app*"]
