  <head><title>Dense retrieval and RRF</title></head>
  <body>
    <article>
      <h1>Dense retrieval</h1>
      <p>
        Dense retrieval embeds queries and passages into a shared vector
        space and retrieves semantically similar passages.
      </p>
      <p>
        Reciprocal Rank Fusion combines ranked lists using rank positions,
        avoiding direct addition of incomparable BM25 and cosine scores.
      </p>
    </article>
